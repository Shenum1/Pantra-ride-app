name: EAS Update

# Manual trigger only, for now: this publishes an OTA JS/asset update to a live
# EAS Update channel. Auto-triggering on push to main is a later step, once the
# team has a track record with manually-dispatched updates. Do NOT use this for
# changes to app.json/app.config.js, eas.json, or native dependencies — those
# need `eas build` (see eas-build.yml), since OTA updates only apply within the
# same native runtime version.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel to publish to'
        required: true
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: 'Update message (shown in EAS dashboard)'
        required: false
        type: string

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install EAS CLI
        run: bun add -g eas-cli

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch "${{ inputs.channel }}" \
            --message "${{ inputs.message || format('Manual update via GitHub Actions ({0})', github.sha) }}" \
            --non-interactive
