name: admin-web CI

on:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  workflow_dispatch:

concurrency:
  group: admin-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build
