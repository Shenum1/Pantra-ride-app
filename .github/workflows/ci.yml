name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration

      # Non-blocking for now: as of this workflow's introduction, expo-doctor reports
      # 2 pre-existing issues (a duplicate expo-location transitive dependency pulled
      # in by @teovilla/react-native-web-maps, and expo/expo-constants/expo-updates
      # being one patch version behind SDK 54) that need a tested fix, not a CI-time
      # auto-correction. Remove `continue-on-error` once those are resolved.
      - name: Validate Expo config
        run: bunx expo-doctor
        continue-on-error: true

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan
        run: gitleaks detect --source . -v --redact
