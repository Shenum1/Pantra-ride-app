name: EAS Submit

# Manual trigger only, gated by the `production-submit` GitHub Environment, which
# must be configured (Settings → Environments) with required reviewers before this
# workflow can run — this pushes a build to a live app store listing and should
# never happen without a human approving the specific run.
#
# iOS submit is intentionally not wired up: eas.json has no iOS submit config
# (no App Store Connect API key configured yet), so only Android is available here.
on:
  workflow_dispatch:
    inputs:
      buildId:
        description: 'EAS build ID to submit (leave empty to submit the latest production Android build)'
        required: false
        type: string

jobs:
  submit:
    name: Submit to Google Play (internal track)
    runs-on: ubuntu-latest
    environment: production-submit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install EAS CLI
        run: bun add -g eas-cli

      - name: Write Google Play service account key
        run: echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "${{ inputs.buildId }}" ]; then
            eas submit --platform android --id "${{ inputs.buildId }}" --non-interactive
          else
            eas submit --platform android --latest --non-interactive
          fi
