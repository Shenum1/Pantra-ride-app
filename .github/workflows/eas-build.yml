name: EAS Build

# Manual trigger only: this produces a native binary via EAS Build. Required for
# any change to app.json/app.config.js, eas.json, native dependency versions, or
# permissions — JS/asset-only changes should use eas-update.yml (OTA) instead.
#
# NOTE: before this workflow can succeed, the EXPO_PUBLIC_* environment variables
# (Google Maps key, Supabase URL/anon key, Paystack/Flutterwave public keys, AdMob
# IDs, RORK API base URL) must exist as EAS environment variables for the target
# environment (`eas env:create`) — app.config.js reads them from process.env at
# config-eval time. See the CI/CD audit report for the full variable list.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install EAS CLI
        run: bun add -g eas-cli

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait
